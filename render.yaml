services:
  - type: web
    name: traq-api
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build && npx prisma migrate deploy
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: traq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: traq-redis
          type: redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://your-netlify-app.netlify.app
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
  - type: redis
    name: traq-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

databases:
  - name: traq-db
    databaseName: traq
    region: frankfurt
    plan: free
